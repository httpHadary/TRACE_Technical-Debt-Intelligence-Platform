spring.application.name=TechDept365

# --- GitHub OAuth App (credentials come from environment variables, never commit them) ---
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-authentication-method=client_secret_post
# Scopes requested at login.
#  - read:user : the signed-in user's profile (/api/me)
#  - repo      : needed to read PRIVATE repositories. It is broad (read AND write): an OAuth App
#                has no read-only private-repo scope. See docs/github-permissions.md.
# Override per environment if needed, e.g. public repositories only:
#   export GITHUB_OAUTH_SCOPE=read:user,public_repo
# Changing scopes does not upgrade tokens users already granted: they must sign in again.
spring.security.oauth2.client.registration.github.scope=${GITHUB_OAUTH_SCOPE:read:user,repo}

# --- GitHub API client ---
# Safety cap on pagination: max pages fetched per request (100 repos per page).
# If an account needs more, the API answers 422 instead of fetching forever.
github.api.max-pages=50

# --- Never leak internals in Spring Boot's default /error responses ---
server.web.error.include-message=never
server.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
